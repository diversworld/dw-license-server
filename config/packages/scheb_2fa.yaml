# TOTP and single-use recovery codes for the administrative firewall.
scheb_two_factor:
    code_reuse_cache: cache.app
    code_reuse_default_handler: scheb_two_factor.security.listener.throw_exception_on_two_factor_code_reuse
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    totp:
        enabled: true
        issuer: Diversworld
        leeway: 0
        template: security/two_factor.html.twig
    backup_codes:
        enabled: true
        manager: App\Security\BackupCodeManager
