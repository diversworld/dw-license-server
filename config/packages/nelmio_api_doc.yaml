nelmio_api_doc:
    documentation:
        info:
            title: Diversworld License API
            description: |
                Version 1 of the license activation and renewal API. Use HTTPS.
                Credentials are sent in JSON request bodies, never in URLs.
                License tokens use Ed25519 and are not JWTs.
                Requests are limited to 60 per minute per client IP, method and path.
            version: 1.0.0
        servers:
            - url: /
              description: Current license server
        tags:
            - name: Licenses
              description: Installation activation and online token renewal
        components:
            securitySchemes:
                apiBearer: { type: http, scheme: bearer, description: Customer-scoped API credential with explicit create/renew scopes }
            schemas:
                TokenResponse:
                    type: object
                    required: [token]
                    properties:
                        token:
                            type: string
                            description: base64url(JSON claims).base64url(Ed25519 signature); contains a signing key identifier
                Problem:
                    type: object
                    properties:
                        type: { type: string }
                        title: { type: string }
                        status: { type: integer }
                        detail: { type: string }
            responses:
                BadRequest:
                    description: Malformed JSON or request structure
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                Unauthorized:
                    description: Invalid token structure or signature
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                Forbidden:
                    description: Unknown, disabled or archived license, customer, product or installation; invalid binding
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                Conflict:
                    description: Installation limit reached
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                Gone:
                    description: License expired
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                UnsupportedMediaType:
                    description: Request must use application/json
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                UnprocessableEntity:
                    description: Input validation failed, required feature missing or offline expiry missing
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                TooManyRequests:
                    description: Rate limit exceeded; retry later
                    headers:
                        Retry-After:
                            schema: { type: string }
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
                ServiceUnavailable:
                    description: Concurrent license operation; retry later
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Problem' }
    areas:
        path_patterns: ['^/api/v1/(?:licenses|management)(?:/|$)']
